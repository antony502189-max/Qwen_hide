name: ChatGPT Controller CI

on:
  push:
    branches:
      - feature/chatgpt-desktop-controller
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Guard stable window and hotkey surfaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'src/ChatGPTDesktopController/WindowController.cs' = '6704033d90916de8260b1309d8169ae5e8a92606'
            'src/ChatGPTDesktopController/GlobalHotkeys.cs' = '3d54d67e9981863e3253e2f3991e349e382ba4b4'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (git hash-object -- $entry.Key).Trim()
            if ($actual -ne $entry.Value) {
              throw "Stable controller surface changed unexpectedly: $($entry.Key). Expected Git blob $($entry.Value), got $actual"
            }
          }

      - name: Validate privacy PowerShell probes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            '.\scripts\test-chatgpt-capture-privacy.ps1',
            '.\scripts\watch-chatgpt-capture-affinity.ps1'
          )
          foreach ($script in $scripts) {
            if (-not (Test-Path -LiteralPath $script)) { throw "Missing privacy probe: $script" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $script"
            }
          }

      - name: Full build, tests and packaging
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1

      - name: Verify packaged executable
        shell: powershell
        run: |
          if (-not (Test-Path .\dist-single\ChatGPTDesktopController.exe)) { throw 'Missing packaged executable' }
          if (-not (Test-Path .\dist-single\SHA256SUMS.txt)) { throw 'Missing SHA256SUMS.txt' }
          Get-Item .\dist-single\ChatGPTDesktopController.exe | Format-List Name,Length,LastWriteTime
          Get-Content .\dist-single\SHA256SUMS.txt

      - name: Upload packaged controller
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTDesktopController-win-x64
          path: |
            dist-single/ChatGPTDesktopController.exe
            dist-single/SHA256SUMS.txt
          if-no-files-found: error
