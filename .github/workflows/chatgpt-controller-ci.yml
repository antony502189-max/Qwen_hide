name: ChatGPT Controller CI

on:
  push:
    branches:
      - feature/chatgpt-desktop-controller
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChatGPTDesktopController.sln

      - name: Build
        run: dotnet build ChatGPTDesktopController.sln -c Release --no-restore

      - name: Test
        run: dotnet test ChatGPTDesktopController.sln -c Release --no-build --logger "console;verbosity=normal"
