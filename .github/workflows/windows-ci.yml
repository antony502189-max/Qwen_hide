name: Windows CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Architecture guard - no embedded Qwen WebView
        shell: pwsh
        run: |
          $patterns = 'Microsoft.Web.WebView2|CoreWebView2|<wv:WebView2'
          $hits = Get-ChildItem src -Recurse -File | Where-Object { $_.Extension -in '.cs','.xaml','.csproj' } | Select-String -Pattern $patterns
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Embedded WebView/Qwen wrapper code is forbidden in native-controller mode.'
          }

      - name: PowerShell 7 parse and runtime-probe smoke
        shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $parseFailures += $errors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Error $_ }
            throw 'PowerShell parse validation failed.'
          }
          $probe = Join-Path $env:RUNNER_TEMP 'qdc-runtime-probe-pwsh7.json'
          & .\scripts\runtime-probe.ps1 -OutputPath $probe
          if (-not (Test-Path $probe)) { throw 'Runtime probe did not create JSON output.' }
          $parsed = Get-Content -Raw $probe | ConvertFrom-Json
          if (-not $parsed.generatedAt) { throw 'Runtime probe JSON is malformed.' }

      - name: Windows PowerShell 5.1 runtime-probe compatibility with Qwen-like process
        shell: pwsh
        run: |
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path $winps)) { throw "Windows PowerShell executable not found: $winps" }

          # Launch a harmless copied ping.exe whose process name contains "Qwen" so Windows
          # PowerShell 5.1 must exercise process metadata and native HWND handling.
          $qwenProbeExe = Join-Path $env:RUNNER_TEMP 'QwenProbe.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\ping.exe') $qwenProbeExe -Force
          $synthetic = Start-Process -FilePath $qwenProbeExe -ArgumentList '127.0.0.1','-t' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Milliseconds 500
            $probe = Join-Path $env:RUNNER_TEMP 'qdc-runtime-probe-winps51.json'
            & $winps -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\runtime-probe.ps1 -OutputPath $probe
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell runtime probe failed with exit code $LASTEXITCODE" }
            if (-not (Test-Path $probe)) { throw 'Windows PowerShell runtime probe did not create JSON output.' }
            $parsed = Get-Content -Raw $probe | ConvertFrom-Json
            if (-not $parsed.generatedAt) { throw 'Windows PowerShell runtime probe JSON is malformed.' }
            if (@($parsed.qwenProcesses).Count -lt 1) { throw 'Windows PowerShell runtime probe did not enumerate the synthetic Qwen-like process.' }
            $match = @($parsed.qwenProcesses | Where-Object { $_.processName -match 'QwenProbe' })
            if ($match.Count -lt 1) { throw 'Synthetic QwenProbe process is missing from runtime probe JSON.' }
            Write-Host "Windows PowerShell compatibility probe version: $($parsed.powershellVersion)"
            Write-Host "Synthetic Qwen-like processes enumerated: $(@($parsed.qwenProcesses).Count)"
          }
          finally {
            if ($synthetic -and -not $synthetic.HasExited) { Stop-Process -Id $synthetic.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Windows PowerShell 5.1 MSAA helper compile smoke
        shell: pwsh
        run: |
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $winps -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\qwen-msaa-probe.ps1 -CompileOnly
          if ($LASTEXITCODE -ne 0) { throw "MSAA probe helper compile failed with exit code $LASTEXITCODE" }

      - name: Restore
        run: dotnet restore QwenWorkOverlay.sln

      - name: Build
        run: dotnet build QwenWorkOverlay.sln -c Release --no-restore

      - name: Test
        run: dotnet test QwenWorkOverlay.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publish win-x64 reliable multi-file
        run: dotnet publish src/QwenWorkOverlay/QwenWorkOverlay.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: Publish win-x64 single-file variant
        run: dotnet publish src/QwenWorkOverlay/QwenWorkOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o dist-single

      - name: Package runtime probe and guides
        shell: pwsh
        run: |
          $extras = @('runtime-probe.ps1','qwen-uia-probe.ps1','qwen-msaa-probe.ps1','diagnose.ps1','setup-virtual-audio.ps1')
          foreach ($name in $extras) { Copy-Item (Join-Path 'scripts' $name) (Join-Path 'dist' $name) -Force; Copy-Item (Join-Path 'scripts' $name) (Join-Path 'dist-single' $name) -Force }
          $docs = @('README.md','GUIDE_EN.md','GUIDE_RU.md','MANUAL_TEST_CHECKLIST_EN.md','RUN_ME_FIRST_RU.txt')
          foreach ($name in $docs) { Copy-Item $name (Join-Path 'dist' $name) -Force; Copy-Item $name (Join-Path 'dist-single' $name) -Force }

      - name: Verify release payloads and generate hashes
        shell: pwsh
        run: |
          foreach ($dir in @('dist','dist-single')) {
            $required = @('QwenDesktopController.exe','runtime-probe.ps1','qwen-uia-probe.ps1','qwen-msaa-probe.ps1','diagnose.ps1','setup-virtual-audio.ps1','GUIDE_RU.md','RUN_ME_FIRST_RU.txt')
            foreach ($name in $required) {
              $path = Join-Path $dir $name
              if (-not (Test-Path $path)) { throw "Required release file not found: $path" }
            }
            $exe = Get-Item (Join-Path $dir 'QwenDesktopController.exe')
            if ($exe.Length -lt 100KB) { throw "Release executable is unexpectedly small: $($exe.Length) bytes" }
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            "QwenDesktopController.exe  SHA256  $hash" | Set-Content -Encoding ASCII (Join-Path $dir 'SHA256SUMS.txt')
            Write-Host "$dir EXE bytes: $($exe.Length)"
            Write-Host "$dir EXE SHA256: $hash"
          }
          $singleDlls = @(Get-ChildItem dist-single -Filter 'QwenDesktopController.dll' -File -ErrorAction SilentlyContinue)
          if ($singleDlls.Count -gt 0) { throw 'Single-file publish unexpectedly contains QwenDesktopController.dll.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QwenDesktopController-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload reliable multi-file release
        uses: actions/upload-artifact@v4
        with:
          name: QwenDesktopController-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload single-file release
        uses: actions/upload-artifact@v4
        with:
          name: QwenDesktopController-win-x64-single
          path: dist-single/
          if-no-files-found: error
          retention-days: 90
