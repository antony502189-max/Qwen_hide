name: Windows CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Architecture guard - no embedded Qwen WebView
        shell: pwsh
        run: |
          $patterns = 'Microsoft.Web.WebView2|CoreWebView2|<wv:WebView2'
          $hits = Get-ChildItem src -Recurse -File | Where-Object { $_.Extension -in '.cs','.xaml','.csproj' } | Select-String -Pattern $patterns
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Embedded WebView/Qwen wrapper code is forbidden in native-controller mode.'
          }

      - name: PowerShell parse and runtime-probe smoke
        shell: pwsh
        run: |
          $parseFailures = @()
          Get-ChildItem scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $parseFailures += $errors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($parseFailures.Count -gt 0) {
            $parseFailures | ForEach-Object { Write-Error $_ }
            throw 'PowerShell parse validation failed.'
          }
          $probe = Join-Path $env:RUNNER_TEMP 'qdc-runtime-probe.json'
          & .\scripts\runtime-probe.ps1 -OutputPath $probe
          if (-not (Test-Path $probe)) { throw 'Runtime probe did not create JSON output.' }
          $parsed = Get-Content -Raw $probe | ConvertFrom-Json
          if (-not $parsed.generatedAt) { throw 'Runtime probe JSON is malformed.' }

      - name: Restore
        run: dotnet restore QwenWorkOverlay.sln

      - name: Build
        run: dotnet build QwenWorkOverlay.sln -c Release --no-restore

      - name: Test
        run: dotnet test QwenWorkOverlay.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publish win-x64
        run: dotnet publish src/QwenWorkOverlay/QwenWorkOverlay.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: Package runtime probe and guides
        shell: pwsh
        run: |
          Copy-Item scripts\runtime-probe.ps1 dist\runtime-probe.ps1 -Force
          Copy-Item README.md dist\README.md -Force
          Copy-Item GUIDE_EN.md dist\GUIDE_EN.md -Force
          Copy-Item GUIDE_RU.md dist\GUIDE_RU.md -Force
          Copy-Item MANUAL_TEST_CHECKLIST_EN.md dist\MANUAL_TEST_CHECKLIST_EN.md -Force
          Copy-Item RUN_ME_FIRST_RU.txt dist\RUN_ME_FIRST_RU.txt -Force

      - name: Verify release payload
        shell: pwsh
        run: |
          $required = @(
            'dist\QwenDesktopController.exe',
            'dist\runtime-probe.ps1',
            'dist\GUIDE_RU.md',
            'dist\RUN_ME_FIRST_RU.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required release file not found: $path" }
          }
          $exe = Get-Item 'dist\QwenDesktopController.exe'
          if ($exe.Length -lt 100KB) { throw "Release executable is unexpectedly small: $($exe.Length) bytes" }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          Write-Host "Release bytes: $($exe.Length)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QwenDesktopController-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenDesktopController-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90
